<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultiBox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0a0a0c);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --accent: #4ea1ff;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        .user-btn { background: var(--card-bg); padding: 6px 12px; border-radius: 20px; font-size: 14px; border: none; color: var(--text); }

        .tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .tab { background: var(--card-bg); border: none; padding: 10px 16px; border-radius: 12px; color: var(--hint); cursor: pointer; white-space: nowrap; font-size: 15px; transition: 0.2s; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }

        .search { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #333; background: var(--card-bg); color: var(--text); margin-bottom: 20px; font-size: 15px; }
        .search:focus { outline: none; border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: transparent; border-radius: 12px; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .card:active { transform: scale(0.96); }
        .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; background: #2c2c2e; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-title { font-size: 15px; font-weight: bold; margin: 0 0 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-desc { font-size: 13px; color: var(--hint); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Стили для полноэкранного плеера */
        #player-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column;
        }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(0,0,0,0.8); }
        .player-header h2 { margin: 0; font-size: 18px; color: white; }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .iframe-container { flex: 1; width: 100%; background: #000; position: relative; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">MultiBox</div>
        <button class="user-btn" id="user-name">Гость</button>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-type="movie">🎬 Фильмы</button>
        <button class="tab" data-type="book">📚 Книги</button>
        <button class="tab" data-type="music">🎵 Музыка</button>
    </div>

    <input type="text" id="search" class="search" placeholder="Поиск...">
    <div class="grid" id="catalog"></div>

    <!-- Экран плеера -->
    <div id="player-screen">
        <div class="player-header">
            <h2 id="player-title">Загрузка...</h2>
            <button class="close-btn" onclick="closePlayer()">✖</button>
        </div>
        <div class="iframe-container">
            <iframe id="video-iframe" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
        }

        // База с настоящими фильмами и ссылками на плееры
        const db = {
            movie: [
                { 
                    title: "Интерстеллар", 
                    desc: "Фантастика", 
                    img: "https://image.tmdb.org/t/p/w500/1pdfLvkbY9ohJlCjQH2CZjjYVvJ.jpg",
                    // Ссылка на встроенный плеер (пример VK Video)
                    player: "https://vk.com/video_ext.php?oid=-12345678&id=456239017&hash=abcdef1234567890" 
                },
                { 
                    title: "Джон Уик 4", 
                    desc: "Боевик", 
                    img: "https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg",
                    player: "https://vk.com/video_ext.php?oid=-12345678&id=456239017&hash=abcdef1234567890"
                },
                { 
                    title: "Оппенгеймер", 
                    desc: "Драма", 
                    img: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg",
                    player: "https://vk.com/video_ext.php?oid=-12345678&id=456239017&hash=abcdef1234567890"
                }
            ],
            book: [], // Пока пусто
            music: [] // Пока пусто
        };

        let currentType = 'movie';

        function render() {
            const catalog = document.getElementById('catalog');
            const searchInput = document.getElementById('search');
            
            const query = searchInput.value.toLowerCase();
            const items = db[currentType].filter(item => item.title.toLowerCase().includes(query));
            
            catalog.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.img}" class="card-img" onerror="this.style.display='none'">
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                `;
                
                // Клик по карточке открывает плеер
                card.addEventListener('click', () => {
                    document.getElementById('player-title').innerText = item.title;
                    document.getElementById('video-iframe').src = item.player;
                    document.getElementById('player-screen').style.display = 'flex';
                    // Скрываем стандартную кнопку "Назад" в Telegram, чтобы не было конфликта
                    tg.BackButton.show();
                });
                
                catalog.appendChild(card);
            });

            if (items.length === 0) {
                catalog.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: gray;">Ничего не найдено</p>';
            }
        }

        // Закрытие плеера
        window.closePlayer = function() {
            document.getElementById('player-screen').style.display = 'none';
            document.getElementById('video-iframe').src = '';
            tg.BackButton.hide();
        }

        // Обработка кнопки "Назад" в Telegram
        tg.BackButton.onClick(() => {
            closePlayer();
        });

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentType = e.target.dataset.type;
                render();
            });
        });

        document.getElementById('search').addEventListener('input', render);

        render();
    </script>
</body>
</html>
