<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultiBox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0f0f11);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --accent: #4ea1ff;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent); }
        .user-btn { background: var(--card-bg); padding: 6px 12px; border-radius: 20px; font-size: 14px; border: none; color: var(--text); }

        .tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .tab { background: var(--card-bg); border: none; padding: 10px 16px; border-radius: 12px; color: var(--hint); cursor: pointer; white-space: nowrap; font-size: 15px; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }

        .search { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #333; background: var(--card-bg); color: var(--text); margin-bottom: 20px; font-size: 15px; }
        .search:focus { outline: none; border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.1s; }
        .card:active { transform: scale(0.98); }
        .card-img { height: 160px; background: #2c2c2e; border-radius: 8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .card-title { font-size: 15px; font-weight: bold; margin: 0 0 4px 0; }
        .card-desc { font-size: 12px; color: var(--hint); margin: 0; }

        .game-section { display: none; background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; }
        .game-section input { padding: 10px; font-size: 18px; width: 100px; text-align: center; border-radius: 8px; border: 1px solid #333; background: #000; color: #fff; margin: 10px; }
        .game-btn { padding: 10px 20px; font-size: 16px; border-radius: 8px; background: var(--accent); color: #000; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">MultiBox</div>
        <button class="user-btn" id="user-name">Гость</button>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-type="movie">🎬 Фильмы</button>
        <button class="tab" data-type="book">📚 Книги</button>
        <button class="tab" data-type="music">🎵 Музыка</button>
        <button class="tab" data-type="game">🎮 Игра</button>
    </div>

    <input type="text" id="search" class="search" placeholder="Поиск...">

    <div class="grid" id="catalog"></div>

    <div class="game-section" id="game">
        <h2>Угадай число</h2>
        <p>Я загадал число от 1 до 100.</p>
        <input type="number" id="guess" placeholder="Ваш вариант">
        <button class="game-btn" onclick="checkGuess()">Проверить</button>
        <p id="game-result" style="margin-top: 15px; font-weight: bold;"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Имя пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').innerText = user.first_name;
        }

        // База данных (Демо)
        const db = {
            movie: [
                { title: "Интерстеллар", desc: "Фантастика", icon: "🚀" },
                { title: "Начало", desc: "Триллер", icon: "🌀" },
                { title: "Матрица", desc: "Боевик", icon: "🕶️" },
                { title: "Джентльмены", desc: "Криминал", icon: "🎩" }
            ],
            book: [
                { title: "Евгений Онегин", desc: "Пушкин", icon: "📖" },
                { title: "1984", desc: "Оруэлл", icon: "👁️" },
                { title: "Гарри Поттер", desc: "Роулинг", icon: "⚡" }
            ],
            music: [
                { title: "Blinding Lights", desc: "The Weeknd", icon: "🎵" },
                { title: "Bohemian Rhapsody", desc: "Queen", icon: "🎸" },
                { title: "Shape of You", desc: "Ed Sheeran", icon: "🎤" }
            ]
        };

        let currentType = 'movie';

        // Отрисовка каталога
        function render() {
            const catalog = document.getElementById('catalog');
            const game = document.getElementById('game');
            const searchInput = document.getElementById('search');
            
            if (currentType === 'game') {
                catalog.style.display = 'none';
                searchInput.style.display = 'none';
                game.style.display = 'block';
                return;
            }

            catalog.style.display = 'grid';
            searchInput.style.display = 'block';
            game.style.display = 'none';

            const query = searchInput.value.toLowerCase();
            const items = db[currentType].filter(item => item.title.toLowerCase().includes(query));
            
            catalog.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img">${item.icon}</div>
                    <h3 class="card-title">${item.title}</h3>
                    <p class="card-desc">${item.desc}</p>
                `;
                catalog.appendChild(card);
            });

            if (items.length === 0) {
                catalog.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: gray;">Ничего не найдено</p>';
            }
        }

        // Переключение вкладок
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                currentType = e.target.dataset.type;
                render();
            });
        });

        // Поиск
        document.getElementById('search').addEventListener('input', render);

        // Игра
        let secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        window.checkGuess = function() {
            const input = document.getElementById('guess');
            const result = document.getElementById('game-result');
            const val = parseInt(input.value);
            
            if (!val) return;
            attempts++;

            if (val === secretNumber) {
                result.style.color = '#7bd88f';
                result.innerText = `🎉 Угадал! Число: ${secretNumber}. Попыток: ${attempts}`;
                document.getElementById('guess').disabled = true;
            } else if (val < secretNumber) {
                result.style.color = '#ff9f0a';
                result.innerText = "📈 Больше";
            } else {
                result.style.color = '#ff9f0a';
                result.innerText = "📉 Меньше";
            }
        }

        // Инициализация
        render();
    </script>
</body>
</html>
