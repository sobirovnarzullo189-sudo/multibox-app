<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MultiBox</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #0a0a0c);
            --text: var(--tg-theme-text-color, #ffffff);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --card-bg: var(--tg-theme-secondary-bg-color, #1c1c1e);
            --accent: #4ea1ff;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); padding-bottom: 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); }
        .user-btn { background: var(--card-bg); padding: 6px 12px; border-radius: 20px; font-size: 14px; border: none; color: var(--text); }

        .tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; }
        .tab { background: var(--card-bg); border: none; padding: 10px 16px; border-radius: 12px; color: var(--hint); cursor: pointer; white-space: nowrap; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }

        .search { width: 100%; padding: 12px 16px; border-radius: 12px; border: 1px solid #333; background: var(--card-bg); color: var(--text); margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .card { background: transparent; border-radius: 12px; display: flex; flex-direction: column; cursor: pointer; }
        .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 12px; background: #2c2c2e; margin-bottom: 8px; }
        .card-title { font-size: 15px; font-weight: bold; margin: 0; }

        #loader { text-align: center; padding: 50px; color: var(--hint); }

        #player-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; flex-direction: column; }
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; }
        .player-header h2 { margin: 0; font-size: 18px; color: white; }
        .close-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .iframe-container { flex: 1; width: 100%; position: relative; }
        .iframe-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Кнопка "Смотреть" */
        .watch-btn {
            display: block; width: 100%; padding: 14px; margin-top: 20px;
            background: var(--accent); color: #000; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">MultiBox</div>
        <button class="user-btn" id="user-name">Гость</button>
    </div>

    <div class="tabs" id="tabs">
        <button class="tab active" data-type="movie">🎬 Фильмы</button>
    </div>

    <input type="text" id="search" class="search" placeholder="Поиск...">
    
    <div id="loader">Загрузка...</div>
    <div class="grid" id="catalog"></div>

    <div id="player-screen">
        <div class="player-header">
            <h2 id="player-title"></h2>
            <button class="close-btn" onclick="closePlayer()">✖</button>
        </div>
        <div class="iframe-container">
            <!-- Здесь будет кнопка для отправки видео -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Демо-база (пока без сервера)
        const movies = [
            { id: 1, title: "Носферату", img: "https://image.tmdb.org/t/p/w500/1S7v2Q1eB7y1x2Z3w4V5U6T7S8.jpg" },
            { id: 2, title: "Метрополис", img: "https://image.tmdb.org/t/p/w500/8q1Z2w3e4r5t6y7u8i9o0p.jpg" }
        ];

        function render() {
            const catalog = document.getElementById('catalog');
            document.getElementById('loader').style.display = 'none';
            catalog.innerHTML = '';
            
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${movie.img}" class="card-img" onerror="this.style.display='none'">
                    <h3 class="card-title">${movie.title}</h3>
                `;
                card.addEventListener('click', () => openPlayer(movie));
                catalog.appendChild(card);
            });
        }

        function openPlayer(movie) {
            document.getElementById('player-screen').style.display = 'flex';
            document.getElementById('player-title').innerText = movie.title;
            
            // Вместо iframe, мы будем показывать кнопку, которая отправит команду боту
            const container = document.querySelector('.iframe-container');
            container.innerHTML = `
                <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 20px; text-align: center;">
                    <h3 style="color: white; margin-bottom: 20px;">Фильм: ${movie.title}</h3>
                    <button class="watch-btn" onclick="sendToBot(${movie.id})">Смотреть в Telegram</button>
                    <p style="color: gray; margin-top: 20px;">Нажмите, чтобы получить видео прямо в чат</p>
                </div>
            `;
        }

        window.sendToBot = function(movieId) {
            // Отправляем данные в бота
            tg.sendData(`movie:${movieId}`);
            // Закрываем Mini App, чтобы пользователь увидел сообщение от бота
            tg.close();
        }

        window.closePlayer = function() {
            document.getElementById('player-screen').style.display = 'none';
        }

        render();
    </script>
</body>
</html>
